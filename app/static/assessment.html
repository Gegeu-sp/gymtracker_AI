<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Adolescente - Gym Tracker AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        h3 { color: #34495e; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; color: #555; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; transition: border 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #3498db; outline: none; }
        .btn-primary { background-color: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; transition: background 0.3s; }
        .btn-primary:hover { background-color: #2980b9; }
        .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .classification-card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border-left: 5px solid #3498db; }
        .classification-card h4 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 14px; }
        .classification-value { font-size: 18px; font-weight: bold; margin: 0; }
        .recommendations { background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 5px solid #ffc107; }
        .recommendations h4 { margin-top: 0; color: #856404; }
        .recommendations ul { margin: 0; padding-left: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .btn-view { background: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-view:hover { background: #27ae60; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Voltar para Dashboard</a>
        <h1>📋 Avaliação Física - Adolescente (10-18 anos)</h1>
        
        <h3>Dados do Aluno</h3>
        <div class="form-grid">
            <div class="form-group"><label>Nome:</label><input type="text" id="assess_name" placeholder="Nome do aluno"></div>
            <div class="form-group"><label>Sexo:</label><select id="assess_sex"><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
            <div class="form-group"><label>Idade:</label><input type="number" id="assess_age" min="10" max="18" placeholder="10-18"></div>
        </div>

        <h3>Antropometria</h3>
        <div class="form-grid">
            <div class="form-group"><label>Peso (kg):</label><input type="number" id="assess_weight" step="0.1"></div>
            <div class="form-group"><label>Altura (m):</label><input type="number" id="assess_height" step="0.01" placeholder="Ex: 1.65"></div>
            <div class="form-group"><label>Cintura (cm):</label><input type="number" id="assess_waist" step="0.1"></div>
        </div>

        <h3>Capacidade Aeróbica</h3>
        <div class="form-grid">
            <div class="form-group"><label>PACER 20m (voltas):</label><input type="number" id="assess_pacer"></div>
        </div>

        <h3>Força e Resistência</h3>
        <div class="form-grid">
            <div class="form-group"><label>Flexão de Braços (reps):</label><input type="number" id="assess_pushups"></div>
            <div class="form-group"><label>Curl-up (reps):</label><input type="number" id="assess_curlups"></div>
            <div class="form-group"><label>Salto Horizontal (cm):</label><input type="number" id="assess_jump" step="0.1"></div>
        </div>

        <h3>Flexibilidade</h3>
        <div class="form-grid">
            <div class="form-group"><label>Back-Saver Direita (cm):</label><input type="number" id="assess_flex_right" step="0.1"></div>
            <div class="form-group"><label>Back-Saver Esquerda (cm):</label><input type="number" id="assess_flex_left" step="0.1"></div>
        </div>

        <h3>Velocidade e Agilidade</h3>
        <div class="form-grid">
            <div class="form-group"><label>Sprint 30m (s):</label><input type="number" id="assess_sprint" step="0.01"></div>
            <div class="form-group"><label>Illinois Agility (s):</label><input type="number" id="assess_illinois" step="0.1"></div>
        </div>

        <div class="form-group"><label>Observações:</label><textarea id="assess_notes" rows="3"></textarea></div>

        <button class="btn-primary" onclick="submitAssessment()">💾 Salvar e Gerar Relatório</button>

        <div id="assessment_report" style="display:none;">
            <h3> Relatório de Classificação</h3>
            <div id="report_content"></div>
        </div>

        <h3>Histórico de Avaliações</h3>
        <div id="assessment_history">Carregando...</div>
    </div>

    <script>
        async function submitAssessment() {
            const data = {
                student_name: document.getElementById('assess_name').value,
                sex: document.getElementById('assess_sex').value,
                age: parseInt(document.getElementById('assess_age').value),
                weight_kg: parseFloat(document.getElementById('assess_weight').value) || null,
                height_m: parseFloat(document.getElementById('assess_height').value) || null,
                waist_circumference_cm: parseFloat(document.getElementById('assess_waist').value) || null,
                pacer_laps: parseInt(document.getElementById('assess_pacer').value) || null,
                push_ups: parseInt(document.getElementById('assess_pushups').value) || null,
                curl_ups: parseInt(document.getElementById('assess_curlups').value) || null,
                standing_long_jump_cm: parseFloat(document.getElementById('assess_jump').value) || null,
                flexibility_right_cm: parseFloat(document.getElementById('assess_flex_right').value) || null,
                flexibility_left_cm: parseFloat(document.getElementById('assess_flex_left').value) || null,
                sprint_30m_seconds: parseFloat(document.getElementById('assess_sprint').value) || null,
                illinois_agility_seconds: parseFloat(document.getElementById('assess_illinois').value) || null,
                notes: document.getElementById('assess_notes').value
            };

            try {
                const res = await fetch('/assessment/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                const result = await res.json();
                if (result.success) {
                    alert('✅ Avaliação salva com sucesso!');
                    displayReport(result.report);
                    loadAssessmentHistory();
                } else { alert('❌ Erro ao salvar'); }
            } catch (error) { alert('Erro de conexão'); }
        }

        function displayReport(report) {
            const reportDiv = document.getElementById('assessment_report');
            const contentDiv = document.getElementById('report_content');
            let html = '<div class="report-grid">';
            const names = {'aerobic': 'Aeróbico (PACER)', 'strength': 'Força/Resistência', 'flexibility': 'Flexibilidade', 'speed': 'Velocidade (30m)', 'agility': 'Agilidade (Illinois)'};
            
            for (const [key, value] of Object.entries(report.classifications)) {
                html += `<div class="classification-card"><h4>${names[key] || key}</h4><p class="classification-value">${value}</p></div>`;
            }
            html += '</div>';
            
            if (report.recommendations.length > 0) {
                html += '<div class="recommendations"><h4>💡 Recomendações:</h4><ul>';
                report.recommendations.forEach(rec => html += `<li>${rec}</li>`);
                html += '</ul></div>';
            }
            contentDiv.innerHTML = html;
            reportDiv.style.display = 'block';
        }

        async function loadAssessmentHistory() {
            try {
                const res = await fetch('/assessment/list');
                const assessments = await res.json();
                const historyDiv = document.getElementById('assessment_history');
                if (assessments.length === 0) { historyDiv.innerHTML = '<p>Nenhuma avaliação registrada.</p>'; return; }
                
                let html = '<table><thead><tr><th>Nome</th><th>Sexo</th><th>Idade</th><th>Data</th><th>PACER</th><th>Ações</th></tr></thead><tbody>';
                assessments.forEach(a => {
                    html += `<tr><td>${a.student_name}</td><td>${a.sex}</td><td>${a.age}</td><td>${new Date(a.date).toLocaleDateString()}</td><td>${a.pacer_laps || '-'}</td><td><button class="btn-view" onclick="viewAssessment(${a.id})">Ver</button></td></tr>`;
                });
                html += '</tbody></table>';
                historyDiv.innerHTML = html;
            } catch (error) { historyDiv.innerHTML = 'Erro ao carregar histórico.'; }
        }

        async function viewAssessment(id) {
            try {
                const res = await fetch(`/assessment/${id}`);
                const a = await res.json();
                document.getElementById('assess_name').value = a.student_name;
                document.getElementById('assess_sex').value = a.sex;
                document.getElementById('assess_age').value = a.age;
                document.getElementById('assess_weight').value = a.weight_kg || '';
                document.getElementById('assess_height').value = a.height_m || '';
                document.getElementById('assess_waist').value = a.waist_circumference_cm || '';
                document.getElementById('assess_pacer').value = a.pacer_laps || '';
                document.getElementById('assess_pushups').value = a.push_ups || '';
                document.getElementById('assess_curlups').value = a.curl_ups || '';
                document.getElementById('assess_jump').value = a.standing_long_jump_cm || '';
                document.getElementById('assess_flex_right').value = a.flexibility_right_cm || '';
                document.getElementById('assess_flex_left').value = a.flexibility_left_cm || '';
                document.getElementById('assess_sprint').value = a.sprint_30m_seconds || '';
                document.getElementById('assess_illinois').value = a.illinois_agility_seconds || '';
                document.getElementById('assess_notes').value = a.notes || '';
                
                displayReport({
                    classifications: {
                        aerobic: a.aerobic_classification, strength: a.strength_classification,
                        flexibility: a.flexibility_classification, speed: a.speed_classification, agility: a.agility_classification
                    }, recommendations: []
                });
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (error) { alert('Erro ao carregar avaliação'); }
        }

        document.addEventListener('DOMContentLoaded', loadAssessmentHistory);
    </script>
</body>
</html>
